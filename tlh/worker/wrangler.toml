# wrangler.toml — Cloudflare Worker config for tlh-feed
#
# Worker is deployed live at https://coiledlamb.tlh-feed.workers.dev.
# `name` matches the production worker; KV namespace id below points
# at the production FEED namespace. Both are safe to commit — KV ids
# are identifiers, not secrets, and a deploy still requires an
# authenticated `wrangler login` against the owning account.
#
# To deploy:
#   cd tlh/worker && wrangler deploy
#
# First-time setup on a different account: see README.md for the
# `wrangler kv namespace create FEED` workflow.

name = "coiledlamb"
main = "index.js"
compatibility_date = "2026-05-05"

[[kv_namespaces]]
binding = "FEED"
id = "c7bdbec95cd6476f9c87abf55c03fdcb"

# v0.0.9.6.10.24 — surface logs/traces in the Cloudflare dashboard so
# future debugging doesn't require a live `wrangler tail` session.
# head_sampling_rate = 1 captures every request; at this volume the
# cost is negligible. Drop to 0.1 if traffic ever scales.
[observability]
enabled = true
head_sampling_rate = 1
