<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="oil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#40a4b9"/>
      <stop offset="25%"  stop-color="#77bfcf"/>
      <stop offset="50%"  stop-color="#da8bda"/>
      <stop offset="75%"  stop-color="#9d78d4"/>
      <stop offset="100%" stop-color="#40a4b9"/>
    </linearGradient>
  </defs>
  <!-- circular background -->
  <circle cx="16" cy="16" r="16" fill="#0f3b3a"/>
  <!-- coil / spiral: 3 concentric arcs tightening inward, oilslick stroke -->
  <path d="M 26 16 A 10 10 0 1 1 15.999 6.001" fill="none" stroke="url(#oil)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 22 16 A 6 6 0 1 1 15.999 10.001" fill="none" stroke="url(#oil)" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <path d="M 19 16 A 3 3 0 1 1 15.999 13.001" fill="none" stroke="url(#oil)" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
  <!-- centre dot -->
  <circle cx="16" cy="16" r="1.4" fill="#77bfcf"/>
</svg>
