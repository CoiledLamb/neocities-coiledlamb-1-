<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toys — Coiled Lamb</title>
  <link rel="stylesheet" href="boot.css" />
  <link rel="stylesheet" href="nav.css" />
  <style>
    html, body { margin:0; background:#155352; color:#b1c9c3; font-family:'Source Code Pro',monospace; min-height:100vh; }
    #site { opacity:0; transition:opacity 0.7s ease; }
    #site.visible { opacity:1; }
    .toys-page { padding:40px 40px 60px; box-sizing:border-box; }
    h1 { margin:0 0 6px; font-size:clamp(1.6rem,3vw,2.6rem); line-height:1; font-weight:700; color:#e0eeec; text-transform:lowercase; }
    .subtitle { font-size:12px; color:#7aa8a6; margin:0 0 32px; letter-spacing:0.05em; text-transform:lowercase; }
    .toy-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; max-width:800px; }
    .toy-card { display:flex; flex-direction:column; padding:20px; background:rgba(11,46,45,0.55); border:1px solid #1e5554; border-radius:2px; text-decoration:none; color:#b1c9c3; transition:border-color 0.15s; }
    .toy-card:hover { border-color:#40a4b9; }
    .toy-name { font-size:13px; font-weight:700; margin:0 0 6px; color:#e0eeec; text-transform:lowercase; }
    .toy-desc { font-size:11px; color:#7aa8a6; line-height:1.6; margin:0; }
    .toy-arr { margin-top:14px; font-size:18px; color:#3a6a68; align-self:flex-end; }
    .toy-badge { display:inline-block; font-size:8px; padding:1px 5px; background:rgba(157,120,212,0.12); border:1px solid rgba(157,120,212,0.28); color:rgba(218,139,218,0.80); border-radius:2px; margin-left:6px; vertical-align:middle; letter-spacing:0.04em; }
  </style>
</head>
<body>
  <div id="scanlines"></div>
  <div id="boot">
    <div id="boot-ascii"></div>
    <div id="boot-terminal"></div>
    <div id="boot-welcome"></div>
    <span class="boot-skip" onclick="dismissBoot()">[ press any key to skip ]</span>
  </div>
  <div id="site">
    <script>window.NAV_ACTIVE = 'toys';</script>
    <script src="nav.js?v=2"></script>
    <div class="toys-page">
      <h1>Toys</h1>
      <p class="subtitle">experiments &amp; interactive things</p>
      <div class="toy-grid">
        <a class="toy-card" href="oilslick-lab.html">
          <span class="toy-name">Oilslick Labs</span>
          <p class="toy-desc">Live-tunable oil-spill background. Tweak particle count, speed, colour bleed, and more.</p>
          <span class="toy-arr">›</span>
        </a>
        <a class="toy-card" href="the-long-haul.html">
          <span class="toy-name">The Long Haul <span class="toy-badge">new</span></span>
          <p class="toy-desc">Idle courier sim. Walk an endless post-apocalyptic road. Deliver packages. Keep your boots intact.</p>
          <span class="toy-arr">›</span>
        </a>
      </div>
    </div>
  </div>
  <script src="boot.js"></script>
  <script>document.addEventListener('keydown',e=>{if(document.getElementById('boot').style.display!=='none')dismissBoot();});startBoot();</script>
</body>
</html>
