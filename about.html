<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About — Coiled Lamb</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="boot.css" />
  <link rel="stylesheet" href="nav.css" />
  <style>
    html, body { margin:0; background:#155352; color:#b1c9c3; font-family:'Source Code Pro',monospace; min-height:100vh; }
    #site { opacity:0; transition:opacity 0.7s ease; }
    #site.visible { opacity:1; }
    .about-page { padding:40px 40px 60px; box-sizing:border-box; max-width:640px; }
    h1 { margin:0 0 6px; font-size:clamp(1.4rem,3vw,2.2rem); font-weight:700; line-height:1; color:#e0eeec; text-transform:lowercase; }
    .subtitle { font-size:11px; color:#4a7a78; letter-spacing:0.06em; margin:0 0 36px; text-transform:lowercase; }
    .glass { background:rgba(11,46,45,0.55); border:1px solid #1e5554; border-radius:2px; padding:24px; }
    .field-row { display:flex; flex-direction:column; gap:3px; margin-bottom:18px; }
    .field-row:last-child { margin-bottom:0; }
    .field-key { font-size:10px; text-transform:uppercase; letter-spacing:0.10em; color:#3a6a68; }
    .field-val { font-size:12px; color:#7aa8a6; line-height:1.6; }
  </style>
</head>
<body>
  <div id="scanlines"></div>
  <div id="boot">
    <div id="boot-ascii"></div>
    <div id="boot-terminal"></div>
    <div id="boot-welcome"></div>
    <span class="boot-skip" onclick="dismissBoot()">[ press any key to skip ]</span>
  </div>
  <div id="site">
    <script>window.NAV_ACTIVE = 'about';</script>
    <script src="nav.js?v=3"></script>
    <div class="about-page">
      <h1>About</h1>
      <p class="subtitle">coiled lamb</p>
      <div class="glass">
        <div class="field-row"><span class="field-key">Who</span><span class="field-val">—</span></div>
        <div class="field-row"><span class="field-key">What</span><span class="field-val">—</span></div>
        <div class="field-row"><span class="field-key">Links</span><span class="field-val">—</span></div>
        <div class="field-row"><span class="field-key">Contact</span><span class="field-val">—</span></div>
      </div>
    </div>
  </div>
  <script src="boot.js"></script>
  <script>document.addEventListener('keydown',e=>{if(document.getElementById('boot').style.display!=='none')dismissBoot();});startBoot();</script>
</body>
</html>
