<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oilslick Lab</title>

  <style>
    :root {
      --dock-width: min(390px, calc(100vw - 24px));
      --dock-collapsed-offset: calc(var(--dock-width) - 42px);

      --glass-bg:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.055) 0%,
          rgba(255, 255, 255, 0.018) 28%,
          rgba(255, 255, 255, 0.028) 100%),
        rgba(8, 14, 20, 0.58);

      --glass-bg-strong:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.065) 0%,
          rgba(255, 255, 255, 0.02) 30%,
          rgba(255, 255, 255, 0.03) 100%),
        rgba(8, 14, 20, 0.68);

      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-strong: rgba(255, 255, 255, 0.18);
      --glass-soft: rgba(255, 255, 255, 0.08);
      --glass-soft-2: rgba(255, 255, 255, 0.05);

      --text-main: rgba(255, 255, 255, 0.95);
      --text-soft: rgba(255, 255, 255, 0.76);
      --text-faint: rgba(255, 255, 255, 0.58);

      --panel-radius: 16px;
      --section-radius: 12px;
      --blur: 10px;
      --shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 10px 34px rgba(0, 0, 0, 0.2);
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #155352;
      color: white;
      font-family: "Source Code Pro", monospace;
    }

    body {
      position: relative;
    }

    .glass-surface {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
    }

    .lab-dock {
      position: fixed;
      top: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 40;
      width: var(--dock-width);
      border-radius: calc(var(--panel-radius) + 2px);
      overflow: hidden;
      transform: translateX(0);
      transition:
        transform 0.28s ease,
        opacity 0.2s ease,
        border-color 0.2s ease;
      will-change: transform;
    }

    .lab-dock.collapsed {
      transform: translateX(var(--dock-collapsed-offset));
    }

    .dock-toggle {
      position: absolute;
      top: 14px;
      left: 12px;
      z-index: 5;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(255, 255, 255, 0.025) 100%),
        rgba(8, 14, 20, 0.42);
      color: rgba(255, 255, 255, 0.95);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      line-height: 1;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;
    }

    .dock-toggle:hover {
      background:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.11) 0%,
          rgba(255, 255, 255, 0.035) 100%),
        rgba(8, 14, 20, 0.5);
      border-color: rgba(255, 255, 255, 0.26);
    }

    .dock-toggle:active {
      transform: translateY(1px);
    }

    .dock-inner {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      padding-left: 48px;
      box-sizing: border-box;
    }

    .dock-header {
      padding-right: 6px;
    }

    .dock-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text-main);
    }

    .dock-copy {
      margin: 8px 0 0;
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-soft);
      max-width: 34ch;
    }

    .dock-kbd {
      display: inline-block;
      padding: 1px 5px;
      margin: 0 1px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.065);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: rgba(255, 255, 255, 0.92);
      font-size: 10px;
    }

    .dock-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
      scroll-behavior: smooth;
    }

    .dock-scroll::-webkit-scrollbar {
      width: 12px;
    }

    .dock-scroll::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.025);
      border-radius: 999px;
    }

    .dock-scroll::-webkit-scrollbar-thumb {
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
      background:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.18) 0%,
          rgba(255, 255, 255, 0.09) 100%);
    }

    .dock-scroll::-webkit-scrollbar-thumb:hover {
      background:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.26) 0%,
          rgba(255, 255, 255, 0.13) 100%);
    }

    .dock-scroll {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.18) rgba(255, 255, 255, 0.03);
    }

    .dock-section {
      border-radius: var(--section-radius);
      padding: 12px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-sizing: border-box;
    }

    .dock-section-title {
      margin: 0 0 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .glass-button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(255, 255, 255, 0.025) 100%),
        rgba(8, 14, 20, 0.44);
      color: white;
      padding: 9px 12px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      text-align: left;
      border-radius: 10px;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease,
        opacity 0.18s ease;
    }

    .glass-button:hover {
      background:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.11) 0%,
          rgba(255, 255, 255, 0.035) 100%),
        rgba(8, 14, 20, 0.5);
      border-color: rgba(255, 255, 255, 0.26);
    }

    .glass-button:active {
      transform: translateY(1px);
    }

    .status {
      min-height: 126px;
      font-size: 11px;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.84);
      white-space: pre-line;
    }

    #gui-mount {
      display: block;
    }

    #gui-mount .lil-gui {
      width: 100%;
      max-width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: none;

      --background-color: rgba(255, 255, 255, 0.03);
      --widget-color: rgba(255, 255, 255, 0.05);
      --hover-color: rgba(255, 255, 255, 0.08);
      --focus-color: rgba(255, 255, 255, 0.1);
      --title-background-color: rgba(255, 255, 255, 0.035);
      --text-color: rgba(255, 255, 255, 0.94);
      --number-color: rgba(255, 255, 255, 0.96);
      --string-color: rgba(255, 255, 255, 0.96);
      --font-size: 11px;
      --name-width: 50%;
    }

    #gui-mount .lil-gui.root {
      width: 100%;
    }

    #gui-mount .lil-gui .title {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      letter-spacing: 0.03em;
    }

    #gui-mount .lil-gui .children {
      border-left: none;
    }

    #gui-mount .lil-gui .controller {
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      min-height: 28px;
    }

    #gui-mount .lil-gui .controller:last-child {
      border-bottom: none;
    }

    #gui-mount .lil-gui input {
      color: rgba(255, 255, 255, 0.96);
    }

    /* thicker frosted slider treatment */
    #gui-mount .lil-gui .slider {
      height: 16px;
      border-radius: 999px;
      background:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(255, 255, 255, 0.035) 100%),
        rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        inset 0 0 0 1px rgba(255, 255, 255, 0.015);
      overflow: hidden;
    }

    #gui-mount .lil-gui .fill {
      margin-top: 0;
      height: 100%;
      border-radius: 999px;
      background:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.82) 0%,
          rgba(255, 255, 255, 0.58) 100%);
      opacity: 0.95;
    }

    #gui-mount .lil-gui .slider:hover {
      border-color: rgba(255, 255, 255, 0.16);
      background:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.1) 0%,
          rgba(255, 255, 255, 0.04) 100%),
        rgba(255, 255, 255, 0.03);
    }

    .dock-footer {
      padding-top: 2px;
    }

    .to-top {
      width: 100%;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
    }

    .to-top.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    @media (max-width: 840px) {
      :root {
        --dock-width: calc(100vw - 24px);
        --dock-collapsed-offset: calc(var(--dock-width) - 42px);
      }

      .lab-dock {
        top: auto;
        bottom: 12px;
        max-height: min(78vh, 760px);
      }
    }
  </style>
</head>

<body>
  <aside class="lab-dock glass-surface" id="lab-dock" aria-label="Oilslick controls">
    <button id="dock-toggle" class="dock-toggle" type="button" aria-expanded="true" aria-controls="dock-scroll"
      aria-label="Collapse controls panel" title="Collapse controls panel">
      ‹
    </button>

    <div class="dock-inner">
      <header class="dock-header">
        <h1 class="dock-title">Oilslick Controls</h1>
        <p class="dock-copy">
          Live tuning dock for the oil-spill background. Use drag or click to adjust controls.
          Quick actions: <span class="dock-kbd">R</span> regenerate,
          <span class="dock-kbd">Space</span> pause.
        </p>
      </header>

      <div class="dock-scroll" id="dock-scroll">
        <section class="dock-section">
          <h2 class="dock-section-title">Actions</h2>
          <div class="action-grid">
            <button id="regen-btn" class="glass-button" type="button">Regenerate</button>
            <button id="pause-btn" class="glass-button" type="button">Pause</button>
            <button id="reset-btn" class="glass-button" type="button">Reset Defaults</button>
          </div>
        </section>

        <section class="dock-section">
          <h2 class="dock-section-title">Debug</h2>
          <div class="status" id="lab-status">Lab booting...</div>
        </section>

        <section class="dock-section">
          <h2 class="dock-section-title">Tuning</h2>
          <div id="gui-mount"></div>
        </section>

        <footer class="dock-footer">
          <button id="to-top-btn" class="glass-button to-top" type="button">
            Return to top
          </button>
        </footer>
      </div>
    </div>
  </aside>
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>
  <script src="background/config.js"></script>
  <script src="background/utils.js"></script>
  <script src="background/composition.js"></script>
  <script src="background/curves.js"></script>
  <script src="background/particles.js"></script>
  <script src="background/background.js"></script>
  <script src="background/gui-defaults.js"></script>
  <script src="background/gui-actions.js"></script>
  <script src="background/gui-dock.js"></script>
  <script src="background/gui-controls.js"></script>
  <script src="background/gui.js"></script>
</body>

</html>
