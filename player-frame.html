<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>player</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
</style>
</head>
<body>
<script>
// ==============================================
// PLAYER FRAME — owns the <audio> element.
// Communicates with the parent page via postMessage.
//
// Commands received from parent:
//   { cmd: 'play'   }
//   { cmd: 'pause'  }
//   { cmd: 'load',    idx: Number, play: Boolean }
//   { cmd: 'seek',    ratio: Number }
//   { cmd: 'volume',  value: Number }
//   { cmd: 'loop',    value: Boolean }
//   { cmd: 'getState' }   // parent requests full state on load
//
// Events broadcast to parent:
//   { evt: 'state', ...state }   // full state snapshot
//   { evt: 'tick',  cur, pct }   // per-second progress update
// ==============================================

const TRACKS = [
  { name: "pilgrim's path", artist: 'craigory ham', src: '/audio/pilgrims-path.mp3', duration: '4:07' },
  { name: 'stoic porridge',  artist: 'craigory ham', src: '/audio/stoic-porridge.mp3', duration: '5:29' },
  { name: 'onward',          artist: 'craigory ham', src: '/audio/onward.mp3',         duration: '5:56' },
  { name: 'drifter',         artist: 'duster',       src: '/audio/drifter.mp3',        duration: '3:41' },
];

let audio   = new Audio();
let idx     = 0;
let playing = false;
let looping = false;
let volume  = 1.0;

function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

function broadcast(obj) {
  try { window.parent.postMessage(obj, '*'); } catch(e) {}
}

function state() {
  return {
    evt:      'state',
    idx,
    playing,
    looping,
    volume,
    name:     TRACKS[idx].name,
    artist:   TRACKS[idx].artist,
    duration: TRACKS[idx].duration,
    cur:      fmt(audio.currentTime),
    pct:      audio.duration ? (audio.currentTime / audio.duration * 100) : 0,
  };
}

function load(i, play) {
  idx = i;
  audio.pause();
  audio = new Audio(TRACKS[i].src);
  audio.volume = volume;
  audio.loop   = looping;
  audio.addEventListener('timeupdate', onTick);
  audio.addEventListener('ended', onEnd);
  audio.addEventListener('error', () => broadcast({ evt: 'err', msg: 'ERR: not found' }));
  broadcast(state());
  if (play) start();
}

function start() {
  audio.play().then(() => {
    playing = true;
    broadcast(state());
  }).catch(() => broadcast({ evt: 'err', msg: 'ERR: cannot play' }));
}

function onTick() {
  broadcast({
    evt: 'tick',
    cur: fmt(audio.currentTime),
    dur: audio.duration ? fmt(audio.duration) : TRACKS[idx].duration,
    pct: audio.duration ? (audio.currentTime / audio.duration * 100) : 0,
  });
}

function onEnd() {
  if (!looping) {
    playing = false;
    load((idx + 1) % TRACKS.length, true);
  }
}

window.addEventListener('message', e => {
  const d = e.data;
  if (!d || !d.cmd) return;
  switch (d.cmd) {
    case 'play':
      if (!playing) start();
      break;
    case 'pause':
      audio.pause(); playing = false;
      broadcast(state());
      break;
    case 'load':
      load(d.idx, d.play);
      break;
    case 'seek':
      if (audio.duration) audio.currentTime = d.ratio * audio.duration;
      break;
    case 'volume':
      volume = d.value;
      audio.volume = volume;
      broadcast(state());
      break;
    case 'loop':
      looping = d.value;
      audio.loop = looping;
      broadcast(state());
      break;
    case 'prev':
      load((idx - 1 + TRACKS.length) % TRACKS.length, playing);
      break;
    case 'next':
      load((idx + 1) % TRACKS.length, playing);
      break;
    case 'getState':
      broadcast(state());
      break;
  }
});

// Initialise with first track loaded but not playing
load(0, false);
</script>
</body>
</html>
