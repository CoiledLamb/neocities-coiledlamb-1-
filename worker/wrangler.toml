# wrangler.toml — Cloudflare Worker config for tlh-feed
#
# Before deploying, run:
#   wrangler kv:namespace create FEED
# Then paste the printed `id` into the [[kv_namespaces]] block below.

name = "tlh-feed"
main = "index.js"
compatibility_date = "2025-01-01"

# Replace the placeholder id below with the one printed by:
#   wrangler kv:namespace create FEED
[[kv_namespaces]]
binding = "FEED"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
