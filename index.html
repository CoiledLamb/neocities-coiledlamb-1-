<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coiled Lamb</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #155352;
      color: white;
      font-family: "Source Code Pro", monospace;
    }

    body {
      position: relative;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      box-sizing: border-box;
    }

    .panel {
      max-width: 700px;
      width: min(90vw, 700px);
      background: rgba(10, 18, 28, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      padding: 28px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
    }

    p {
      margin: 0 0 18px;
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255,255,255,0.9);
    }

    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }

    .links a {
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 10px 14px;
      background: rgba(255,255,255,0.06);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .links a:hover {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.45);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="panel">
      <h1>Coiled Lamb</h1>
      <p>welcome</p>
      <div class="links">
        <a href="studies.html">Studies</a>
        <a href="oilslick-lab.html">Oilslick Labs</a>
      </div>
    </div>
  </div>
</body>
</html>
