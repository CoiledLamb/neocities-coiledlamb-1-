<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coiled Lamb</title>
  <link rel="stylesheet" href="nav.css" />

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #155352;
      color: white;
      font-family: "Source Code Pro", monospace;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      box-sizing: border-box;
    }

    .panel {
      max-width: 560px;
      width: min(90vw, 560px);
      background: rgba(10,18,28,0.32);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      padding: 36px 28px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1;
    }

    p {
      margin: 0 0 24px;
      font-size: 13px;
      line-height: 1.6;
      color: rgba(255,255,255,0.75);
    }

    .links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .links a {
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.22);
      padding: 10px 16px;
      font-size: 12px;
      background: rgba(255,255,255,0.06);
      transition: background 0.2s, border-color 0.2s;
    }

    .links a:hover {
      background: rgba(255,255,255,0.13);
      border-color: rgba(255,255,255,0.40);
    }
  </style>
</head>
<body>
  <script>window.NAV_ACTIVE = 'home';</script>
  <script src="nav.js"></script>

  <div class="page">
    <div class="panel">
      <h1>Coiled Lamb</h1>
      <p>welcome</p>
      <div class="links">
        <a href="studies.html">Studies</a>
        <a href="oilslick-lab.html">Oilslick Labs</a>
      </div>
    </div>
  </div>
</body>
</html>
